spring.application.name=paper-assistant-backend
spring.profiles.default=bootstrap

server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info

# Absolute default independent of IDEA's working directory; outside the Git checkout.
paper.storage.root=${PAPER_STORAGE_ROOT:${user.home}/.paper-assistant/uploads}
paper.storage.max-file-size=${PAPER_UPLOAD_MAX_SIZE:20MB}
spring.servlet.multipart.max-file-size=${paper.storage.max-file-size}
spring.servlet.multipart.max-request-size=${PAPER_UPLOAD_MAX_REQUEST_SIZE:21MB}

# Async ingestion: persisted tasks survive restarts. Python URL works with Docker or PyCharm.
paper.ingestion.enabled=${PAPER_INGESTION_ENABLED:true}
paper.ingestion.base-url=${RAG_BASE_URL:http://127.0.0.1:8001}
paper.ingestion.namespace=${RAG_NAMESPACE:paper-assistant}
paper.ingestion.concurrency=${RAG_CONCURRENCY:1}
paper.ingestion.max-attempts=${RAG_MAX_ATTEMPTS:3}
paper.ingestion.poll-interval=${RAG_POLL_INTERVAL:2s}
paper.ingestion.request-timeout=${RAG_REQUEST_TIMEOUT:10m}
paper.ingestion.lease-duration=${RAG_LEASE_DURATION:11m}
paper.ingestion.retry-delay=${RAG_RETRY_DELAY:5s}
