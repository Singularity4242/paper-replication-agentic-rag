spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/paper_assistant}
spring.datasource.username=${POSTGRES_USER:paper_assistant}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.validate-on-migrate=true
# Flyway is the only schema initializer; do not also execute schema.sql/data.sql.
spring.sql.init.mode=never
