name: paper-assistant

services:
  postgres:
    image: postgres:17.11
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: paper_assistant
      POSTGRES_USER: paper_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 infra/.env 中填写数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_assistant -d paper_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
